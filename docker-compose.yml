services:
  app:
    build: .
    volumes:
      - .:/var/www/html
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:4001
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: boardpack
      DB_USERNAME: boardpack
      DB_PASSWORD: boardpack
      REDIS_HOST: redis
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      SESSION_DRIVER: redis
    depends_on:
      - db
      - redis

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "4001:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  queue:
    build: .
    command: php artisan queue:work --sleep=3 --tries=3
    volumes:
      - .:/var/www/html
    environment:
      APP_ENV: local
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: boardpack
      DB_USERNAME: boardpack
      DB_PASSWORD: boardpack
      REDIS_HOST: redis
      QUEUE_CONNECTION: redis
    depends_on:
      - app
      - redis

  scheduler:
    build: .
    command: php artisan schedule:work
    volumes:
      - .:/var/www/html
    environment:
      APP_ENV: local
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: boardpack
      DB_USERNAME: boardpack
      DB_PASSWORD: boardpack
      REDIS_HOST: redis
      QUEUE_CONNECTION: redis
    depends_on:
      - app

  db:
    image: postgres:16-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: boardpack
      POSTGRES_USER: boardpack
      POSTGRES_PASSWORD: boardpack
    volumes:
      - board_pg:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"

volumes:
  board_pg:
